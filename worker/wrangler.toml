# ================================================================
# Cloudflare Worker — GIS Catalog Scanner
# ================================================================
# Runs health checks and freshness detection for all cataloged datasets.
# Uses R2 for persistent storage of scan results.
#
# Setup
# ─────
# 1. Create an R2 bucket:
#      wrangler r2 bucket create gis-catalog-data
#
# 2. (Optional) Set a CORS-friendly custom domain or route in [env.production].
#
# 3. Deploy:
#      cd worker
#      npx wrangler deploy
#
# Endpoints
# ─────────
#   GET  /health.json             → serves cached health results from R2
#   POST /health/refresh          → triggers health scan, stores in R2
#   GET  /freshness.json          → serves cached freshness results from R2
#   POST /freshness/refresh       → triggers freshness scan, stores in R2
#
# Scheduled (Cron Triggers)
# ─────────────────────────
# Crons run every minute from 6:00-6:30 UTC. Each invocation processes
# one batch, respecting Cloudflare's 50-subrequest limit per invocation.
# A ~150 dataset catalog completes in ~15-20 minutes.
# ================================================================

name = "gis-freshness-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# ── R2 binding ──
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gis-catalog-data"

# ── Cron triggers — runs twice daily (6:00-6:30 UTC and 18:00-18:30 UTC) ──
# Multiple triggers allow processing large catalogs within Cloudflare's
# 50-subrequest limit per invocation. Each trigger processes one batch.
# With HEALTH_BATCH_SIZE=10 and FRESHNESS_BATCH_SIZE=5, a catalog of
# ~150 datasets completes in ~15-20 minutes per window.
[triggers]
crons = ["0-30 6 * * *", "0-30 18 * * *"]

# ── Environment variables ──
[vars]
# The public URL where catalog.json is served (GitHub Pages, Netlify, etc.)
CATALOG_BASE_URL = "https://amateurprojects.github.io/GIS-Web-Services-Catalog"
# Optional shared secret — set via `wrangler secret put REFRESH_TOKEN`
# REFRESH_TOKEN = ""

# ── GitHub OAuth (for admin edits) ──
# 1. Create a GitHub OAuth App at https://github.com/settings/developers
#    - Homepage URL: your catalog URL above
#    - Authorization callback URL: https://<your-worker>.workers.dev/auth/callback
# 2. Set the Client ID here:
GITHUB_CLIENT_ID = "Ov23liBAdrKJLReT1yVR"
# 3. Set secrets via wrangler CLI:
#      wrangler secret put GITHUB_CLIENT_SECRET
#      wrangler secret put GITHUB_ALLOWED_USERS   (comma-separated GitHub usernames)

